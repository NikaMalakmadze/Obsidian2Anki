[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Obsidian2Anki"
version = "0.1.0"
description = "Convert Obsidian notes into Anki cards"
dependencies = [
    "annotated-types==0.7.0",
    "certifi==2026.6.17",
    "charset-normalizer==3.4.7",
    "gitdb==4.0.12",
    "idna==3.18",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic_core==2.46.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "smmap==5.0.3",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "urllib3==2.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
