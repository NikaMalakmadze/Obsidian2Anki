[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "Obsidian2Anki"
version = "0.1.0"
description = "Convert Obsidian notes into Anki cards"
requires-python = ">=3.12"

dependencies = [
    "argcomplete==3.7.0",
    "google-genai==2.10.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-frontmatter==1.3.0",
    "requests==2.34.2",
    "rich==15.0.0",
    "tenacity==9.1.4",
]


[project.scripts]
obsidian2anki = "obsidian2anki.main:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff.lint.per-file-ignores]
"src/*" = ["I001"]

